apiVersion: apps/v1
kind: Deployment
metadata:
  name: guestbook-deployment
  namespace: guestbook
spec:
  replicas: 3
  selector:
    matchLabels:
      app: guestbook
  template:
    metadata:
      labels:
        app: guestbook
    spec:
      containers:
        - name: guestbook-pod
          image: guestbook:v0.1.0
          ports:
            - containerPort: 3000